<!DOCTYPE html>
<html>
<head>
    <title>Login & Register</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
        }

        .container {
            width: 350px;
            margin: 50px auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, .2);
        }

        h2 {
            text-align: center;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 10px;
            border: none;
            cursor: pointer;
            color: white;
        }

        .login {
            background: #3498db;
        }

        .register {
            background: #2ecc71;
        }

        .msg {
            padding: 10px;
            margin-bottom: 10px;
            background: #eee;
            border-radius: 5px;
        }
    </style>
</head>

<body>

    <div class="container">

        <h2>Login & Register</h2>

        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
        {% for category, message in messages %}
        <div class="msg">
            {{ message }}
        </div>
        {% endfor %}
        {% endif %}
        {% endwith %}

        <form method="POST">
            <input type="text" name="username" placeholder="Username" required>
            <input type="password" name="password" placeholder="Password" required>
            <button class="login" type="submit" name="action" value="login">
                Login
            </button>
            <br><br>
            <button class="register" type="submit" name="action" value="register">
                Register
            </button>
        </form>

    </div>

</body>

</html>
