<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ judul }} – Admin Squishly</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='admin_form.css') }}">
</head>

<body>
    <div class="wrap">
        <h1>{{ judul }}</h1>

        {% with messages = get_flashed_messages(with_categories=true) %}
        {% for kategori, pesan in messages %}
        <div class="flash {{ kategori }}">{{ pesan }}</div>
        {% endfor %}
        {% endwith %}

        <form method="post" enctype="multipart/form-data">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <label>Nama produk
                <input type="text" name="nama" value="{{ p[1] if p else '' }}" required maxlength="100">
            </label>

            <label>Deskripsi
                <textarea name="deskripsi" rows="3" maxlength="255">{{ p[2] if p and p[2] else '' }}</textarea>
            </label>

            <div class="row">
                <label>Harga (Rp)
                    <input type="number" name="harga" min="0" value="{{ p[3] if p else '' }}" required>
                </label>
                <label>Stok
                    <input type="number" name="stok" min="0" value="{{ p[5] if p else 0 }}" required>
                </label>
            </div>

            <label>Gambar produk
                {% if p and p[4] %}
                <img id="preview" src="{{ url_for('static', filename='img/' ~ p[4]) }}" alt="Gambar saat ini">
                {% else %}
                <img id="preview" alt="" hidden>
                {% endif %}
                <input type="file" name="gambar" id="gambar" accept="image/jpeg,image/png,image/webp,image/gif">
                <small>JPG, PNG, WEBP, atau GIF, maksimal 5 MB.{% if p %} Kosongkan kalau tidak ingin mengganti gambar.{% endif %}</small>
            </label>

            <div class="btns">
                <button class="btn" type="submit">Simpan</button>
                <a class="btn gray" href="{{ url_for('admin') }}">Batal</a>
            </div>
        </form>
    </div>
<script>
        document.getElementById('gambar').addEventListener('change', function () {
            const img = document.getElementById('preview');
            const file = this.files[0];
            if (!file) return;
            img.src = URL.createObjectURL(file);
            img.hidden = false;
        });
    </script>
</body>

</html>
